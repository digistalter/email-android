#
# Runs the tests on every push and pull request. For a tag "v1.2.3" it also builds the signed APK
# and publishes it as a GitHub release.
#
# Secrets for signing (Settings → Secrets and variables → Actions):
#   SIGNING_KEYSTORE_BASE64   the keystore file, base64-encoded (base64 -w0 release.jks)
#   SIGNING_STORE_PASSWORD    its password
#   SIGNING_KEY_ALIAS         the key's alias
#   SIGNING_KEY_PASSWORD      the key's password
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-configuration-cache testDebugUnitTest
      - name: Debug build
        run: ./gradlew --no-configuration-cache assembleDebug

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "The signing secrets are missing."; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Signed APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-configuration-cache assembleRelease
          version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "e-mail-$version.apk"
          sha256sum "e-mail-$version.apk" > "e-mail-$version.apk.sha256"
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "e-mail-$version.apk" "e-mail-$version.apk.sha256" \
            --title "E-Mail $version" --generate-notes
